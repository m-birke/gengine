[project.urls]
Changelog = "https://github.com/m-birke/gengine/blob/main/CHANGELOG.md"
Documentation = "https://github.com/m-birke/gengine#readme"
Homepage = "https://github.com/m-birke/gengine"
Issues = "https://github.com/m-birke/gengine/issues"
Source = "https://github.com/m-birke/gengine"

[tool.hatch]
build.hooks.vcs.version-file = "src/gengine/_version.py"
build.targets.wheel.packages = ["src/gengine/"]

[tool.hatch.version]
source = "vcs"
raw-options = {version_scheme = "only-version", local_scheme = "no-local-version"}

[tool.hatch.envs.default]
installer = "uv"
path = "./.hatch/default"
dependencies = [
  "coverage[toml]>=6.5",
  "pytest",
]
[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
test-cov = "coverage run -m pytest {args:tests}"
cov-report = [
  "- coverage combine",
  "coverage report",
]
cov = [
  "test-cov",
  "cov-report",
]

[[tool.hatch.envs.all.matrix]]
python = ["3.10", "3.11", "3.12", "3.13", "3.14"]

[tool.hatch.envs.types]
installer = "uv"
path = "./.hatch/types"
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/gengine tests}"

[tool.ruff]
target-version = "py38"
line-length = 120

[tool.ruff.lint]
select = [
  "A",
  "ARG",
  "B",
  "C",
  "DTZ",
  "E",
  "EM",
  "F",
  "FBT",
  "I",
  "ICN",
  "ISC",
  "N",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "Q",
  "RUF",
  "S",
  "T",
  "TID",
  "UP",
  "W",
  "YTT",
]
ignore = [
  # Allow non-abstract empty methods in abstract base classes
  "B027",
  # Allow boolean positional values in function calls, like `dict.get(... True)`
  "FBT003",
  # Ignore checks for possible passwords
  "S105", "S106", "S107",
  # Ignore complexity
  "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915",
]
unfixable = [
  # Don't touch unused imports
  "F401",
]

[tool.ruff.lint.isort]
known-first-party = ["gengine"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Tests can use magic values, assertions, and relative imports
"tests/**/*" = ["PLR2004", "S101", "TID252"]

[tool.mypy]
check_untyped_defs = true
follow_untyped_imports = true
ignore_missing_imports = true

[tool.coverage.run]
source_pkgs = ["gengine", "tests"]
branch = true
parallel = true
omit = [
  "src/gengine/__about__.py",
]

[tool.coverage.paths]
gengine = ["src/gengine", "*/gengine/src/gengine"]
tests = ["tests", "*/gengine/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
